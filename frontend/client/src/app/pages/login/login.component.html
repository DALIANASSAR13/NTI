<div class="auth-container">
  <div class="auth-card">
    <div class="auth-header">
      <div class="brand">
        <svg viewBox="0 0 24 24" fill="none" stroke="#339af0" stroke-width="2.5">
          <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <h1>Welcome Back</h1>
      </div>
      <p>Please enter your details to sign in.</p>
    </div>

    <form (ngSubmit)="onSubmit()" #loginForm="ngForm" class="auth-form">
      <div *ngIf="error" class="error-alert">{{ error }}</div>
      
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" [(ngModel)]="credentials.email" required placeholder="Enter your email" />
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" [(ngModel)]="credentials.password" required placeholder="Enter your password" />
      </div>

      <button type="submit" [disabled]="!loginForm.valid || loading" class="btn-primary">
        {{ loading ? 'Signing in...' : 'Sign In' }}
      </button>
    </form>

    <div class="auth-footer">
      Don't have an account? <a routerLink="/register">Sign up</a>
    </div>
  </div>
</div>
